<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanti Wil</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --radius: 15px;
      --text: #2b2633;
      --muted: #6b6474;
      --surface: rgba(255, 255, 255, 0.90);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(0, 0, 0, 0.08);
      --primary: #9b6bff;
      --primary-soft: rgba(155, 107, 255, 0.24);
      --accent: #ff7c6b;
      --accent-soft: rgba(255, 124, 107, 0.28);
      --shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.055);
      --shadow-card: 0 15px 38px rgba(0, 0, 0, 0.08);
      --root-bg: #f6efff;
      --page-bg:
        radial-gradient(900px 620px at 8% -8%, var(--accent-soft), transparent 60%),
        radial-gradient(860px 620px at 96% 2%, var(--primary-soft), transparent 58%),
        radial-gradient(900px 700px at 45% 115%, rgba(255, 124, 107, 0.16), transparent 60%),
        linear-gradient(180deg, #fff8f7 0%, #f7f2ff 52%, #fff8f7 100%);
    }

    html {
      min-height: 100%;
      background-color: var(--root-bg);
      background-image: var(--page-bg);
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      overscroll-behavior-y: none;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      color: var(--text);
      background: transparent;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      isolation: isolate;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      min-height: 100dvh;
      background: var(--page-bg);
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center top;
      pointer-events: none;
    }

    :focus-visible {
      outline: 3px solid rgba(124, 156, 255, 0.9);
      outline-offset: 3px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.80);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: saturate(140%) blur(10px);
    }

    .appbar-inner,
    .board {
      width: min(1050px, 100%);
      margin-inline: auto;
      padding-inline: 22px;
    }

    .appbar-inner {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      min-height: 66px;
      padding-block: 9px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #ffffff;
      font-size: 19px;
      background: conic-gradient(from 210deg, var(--accent), var(--primary));
      box-shadow: var(--shadow-soft);
    }

    .brand {
      display: grid;
      gap: 1px;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      max-width: 640px;
      font-size: 12.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      justify-content: end;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--surface-strong);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.045);
    }

    .icon-button:hover {
      background: #ffffff;
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .search-input {
      width: 0;
      min-width: 0;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      color: var(--text);
      background: var(--surface-strong);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.045);
      opacity: 0;
      pointer-events: none;
      transition: width 180ms ease, padding 180ms ease, opacity 120ms ease;
    }

    .search-wrap.is-open .search-input {
      width: min(320px, 42vw);
      padding: 0 13px;
      border: 1px solid var(--border);
      opacity: 1;
      pointer-events: auto;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .board {
      padding-top: 24px;
      padding-bottom: 88px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 15px;
    }

    .card {
      min-height: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .card-inner {
      display: grid;
      gap: 11px;
      padding: 16px;
    }

    .meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 11px;
      align-items: center;
    }

    .emoji {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(255, 124, 107, 0.14), rgba(155, 107, 255, 0.14));
      font-size: 20px;
    }

    .who {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }

    .sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .msg {
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .state {
      grid-column: 1 / -1;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      box-shadow: var(--shadow-soft);
      font-size: 15px;
    }

    .state strong {
      color: var(--text);
    }


    .footer {
      margin-top: 64px;
      text-align: center;
      font-size: 11px;
      color: rgba(1, 1, 1, 0.2);
    }

    .footer a {
      color: rgba(1, 1, 1, 0.2);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (hover: hover) {
      .card {
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-card);
      }
    }

    @media (max-width: 700px) {
      .appbar-inner {
        grid-template-columns: 1fr;
        align-items: stretch;
        gap: 8px;
      }

      .toolbar {
        justify-content: start;
      }

      .search-wrap {
        flex: 1;
      }

      .search-wrap.is-open .search-input {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .appbar-inner,
      .board {
        padding-inline: 16px;
      }

      .brand-subtitle {
        white-space: normal;
        line-height: 1.3;
      }

      .board {
        padding-top: 18px;
      }

      .msg {
        font-size: 14.5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand-wrap">
        <div class="logo" aria-hidden="true">❤</div>
        <div class="brand">
          <div class="brand-title">Willkommen an der Kanti Wil</div>
          <div class="brand-subtitle">Wünsche und Tipps von Schüler:innen für eure Schulzeit an der Kanti Wil</div>
        </div>
      </div>

      <div class="toolbar" aria-label="Werkzeuge">
        <div class="search-wrap" id="searchWrap">
          <button class="icon-button" id="searchButton" type="button" aria-label="Suche öffnen" aria-expanded="false" aria-controls="searchInput">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          </button>
          <input class="search-input" id="searchInput" type="search" placeholder="Suchen …" autocomplete="off">
        </div>

        <button class="icon-button" id="shuffleButton" type="button" aria-label="Antworten neu mischen">
          <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="board" aria-label="Nachrichten">
      <div id="grid" class="grid" role="list" aria-live="polite">
        <p class="state">Einträge werden geladen …</p>
      </div>

      <div class="footer">
        by <a href="https://samueltobler.github.io" target="_blank" rel="noopener noreferrer">Samuel Tobler</a> |
        <a href="https://samueltobler.github.io/gymi-tools" target="_blank" rel="noopener noreferrer">Gymi-Tools</a>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const SHEET_ID = "1hlCxUuxBEJhBOiJtbEpka9_ecqfcmd5cUUlckWUCVvc";
    const SHEET_TAB = "Formularantworten 1";
    const OPENSHEET_URL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(SHEET_TAB)}`;
    const FETCH_TIMEOUT_MS = 10000;

    const grid = document.querySelector("#grid");
    const searchWrap = document.querySelector("#searchWrap");
    const searchButton = document.querySelector("#searchButton");
    const searchInput = document.querySelector("#searchInput");
    const shuffleButton = document.querySelector("#shuffleButton");

    let allMessages = [];

    const dateFormatter = new Intl.DateTimeFormat("de-CH", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    function clean(value) {
      return String(value ?? "").trim();
    }

    function firstValue(row, keys) {
      for (const key of keys) {
        const value = clean(row[key]);
        if (value) return value;
      }

      return "";
    }

    function parseDate(value) {
      const text = clean(value);

      let match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (match) {
        const [, year, month, day] = match.map(Number);
        return validDate(year, month, day);
      }

      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?$/);
      if (match) {
        const [, month, day, year] = match.map(Number);
        return validDate(year, month, day);
      }

      match = text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+\d{1,2}:\d{2}(?::\d{2})?)?$/);
      if (match) {
        const [, day, month, year] = match.map(Number);
        return validDate(year, month, day);
      }

      return null;
    }

    function validDate(year, month, day) {
      const date = new Date(Date.UTC(year, month - 1, day));

      const isValid =
        date.getUTCFullYear() === year &&
        date.getUTCMonth() === month - 1 &&
        date.getUTCDate() === day;

      return isValid ? date : null;
    }

    function formatDate(value) {
      const date = parseDate(value);
      return date ? dateFormatter.format(date) : clean(value);
    }

    function normaliseRow(row, index) {
      const timestamp = firstValue(row, ["Zeitstempel", "Timestamp", "date", "Datum"]);

      return {
        id: `${timestamp}-${index}`,
        who: firstValue(row, ["Name", "who"]) || "Unbekannt",
        klasse: firstValue(row, ["Klasse (z.B. 3aW)", "Klasse", "klasse"]),
        date: timestamp,
        emoji: firstValue(row, ["Wähle 1 Emoji als Profilbild", "Emoji", "emoji"]) || "💬",
        text: firstValue(row, ["Deine Nachricht", "Nachricht", "text", "Message"])
      };
    }

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function createTextElement(tagName, className, text) {
      const element = document.createElement(tagName);
      element.className = className;
      element.textContent = text;
      return element;
    }

    function createCard(message) {
      const article = document.createElement("article");
      article.className = "card";
      article.setAttribute("role", "listitem");

      const inner = document.createElement("div");
      inner.className = "card-inner";

      const meta = document.createElement("div");
      meta.className = "meta";

      const emoji = createTextElement("div", "emoji", message.emoji);
      emoji.setAttribute("aria-hidden", "true");

      const person = document.createElement("div");
      const who = createTextElement("div", "who", message.who);

      const subParts = [
        message.klasse ? `Klasse ${message.klasse}` : "",
        formatDate(message.date)
      ].filter(Boolean);

      const sub = createTextElement("div", "sub", subParts.join(" · "));

      person.append(who, sub);
      meta.append(emoji, person);

      const text = createTextElement("div", "msg", message.text);

      inner.append(meta, text);
      article.append(inner);

      return article;
    }

    function renderState(message, strongText = "") {
      grid.replaceChildren();

      const state = document.createElement("p");
      state.className = "state";

      if (strongText) {
        const strong = document.createElement("strong");
        strong.textContent = strongText;
        state.append(strong, document.createTextNode(` ${message}`));
      } else {
        state.textContent = message;
      }

      grid.append(state);
    }

    function renderMessages(messages) {
      grid.replaceChildren();

      if (!messages.length) {
        renderState("Keine passenden Einträge gefunden.");
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const message of messages) {
        fragment.append(createCard(message));
      }

      grid.append(fragment);
    }

    function searchableText(message) {
      return [
        message.who,
        message.klasse,
        message.date,
        formatDate(message.date),
        message.emoji,
        message.text
      ].join(" ").toLowerCase();
    }

    function applySearch() {
      const query = clean(searchInput.value).toLowerCase();

      if (!query) {
        renderMessages(allMessages);
        return;
      }

      const results = allMessages.filter(message => searchableText(message).includes(query));
      renderMessages(results);
    }

    function openSearch() {
      searchWrap.classList.add("is-open");
      searchButton.setAttribute("aria-expanded", "true");
      searchButton.setAttribute("aria-label", "Suche fokussieren");
      window.requestAnimationFrame(() => searchInput.focus());
    }

    function toggleSearch() {
      if (!searchWrap.classList.contains("is-open")) {
        openSearch();
        return;
      }

      searchInput.focus();
    }

    async function fetchJson(url) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      try {
        const response = await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        return await response.json();
      } finally {
        window.clearTimeout(timeout);
      }
    }

    async function loadMessages() {
      try {
        const rows = await fetchJson(OPENSHEET_URL);

        if (!Array.isArray(rows)) {
          throw new Error("Unerwartetes Datenformat");
        }

        allMessages = shuffle(
          rows
            .map(normaliseRow)
            .filter(message => message.text)
        );

        applySearch();
      } catch (error) {
        const reason = error.name === "AbortError"
          ? "Die Anfrage hat zu lange gedauert."
          : error.message;

        renderState(
          `${reason} Prüfe die Sheet-Freigabe, den Tabnamen «Formularantworten 1» und die Spalten Zeitstempel, Name, Klasse (z.B. 3aW), Wähle 1 Emoji als Profilbild, Deine Nachricht.`,
          "Keine Daten geladen."
        );
      }
    }

    searchButton.addEventListener("click", toggleSearch);

    searchInput.addEventListener("input", applySearch);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        searchInput.value = "";
        applySearch();
        searchInput.blur();
      }
    });

    shuffleButton.addEventListener("click", () => {
      allMessages = shuffle(allMessages);
      applySearch();
    });

    loadMessages();
  </script>
</body>
</html>
