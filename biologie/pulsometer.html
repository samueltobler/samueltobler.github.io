<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsmesser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #0f172a;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }

    .page {
      width: min(100%, 420px);
    }

    .app {
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.8rem;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #64748b;
      text-align: center;
    }

    .display {
      margin-bottom: 18px;
      padding: 32px 20px;
      border-radius: 20px;
      background: #f8fafc;
      text-align: center;
    }

    .bpm {
      margin: 0;
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: #e11d48;
    }

    .label {
      margin-top: 10px;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tap-button {
      width: 100%;
      min-height: 120px;
      border: 0;
      border-radius: 20px;
      color: #ffffff;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 700;
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    .tap-button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .tap-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .control-button {
      min-height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      color: #0f172a;
      background: #ffffff;
      cursor: pointer;
      font-weight: 700;
    }

    .control-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .stat {
      padding: 14px;
      border-radius: 14px;
      background: #f8fafc;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 1.2rem;
    }

    .stat span {
      color: #64748b;
      font-size: 0.75rem;
    }

    .status {
      margin: 18px 0 0;
      color: #64748b;
      text-align: center;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.5);
    }

    .footer a {
      color: rgba(0, 0, 0, 0.5);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .app {
        padding: 22px 16px;
      }

      .bpm {
        font-size: 4.3rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="app">
      <h1>Pulsmesser</h1>
      <p class="subtitle">Bei jedem Herzschlag tippen.</p>

      <section class="display">
        <p class="bpm" id="bpm">--</p>
        <div class="label">Schläge pro Minute</div>
      </section>

      <button
        class="tap-button"
        id="tapButton"
        type="button"
        disabled
      >
        Herzschlag
      </button>

      <div class="controls">
        <button
          class="control-button"
          id="startButton"
          type="button"
        >
          Start
        </button>

        <button
          class="control-button"
          id="stopButton"
          type="button"
          disabled
        >
          Stopp
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <strong id="tapCount">0</strong>
          <span>Herzschläge</span>
        </div>

        <div class="stat">
          <strong id="duration">0.0 s</strong>
          <span>Dauer</span>
        </div>
      </div>

      <p class="status" id="status">Bereit</p>
    </main>

    <footer class="footer">
      by
      <a
        href="https://samueltobler.github.io"
        target="_blank"
        rel="noopener noreferrer"
      >
        Samuel Tobler
      </a>
      |
      <a
        href="https://samueltobler.github.io/gymi-tools"
        target="_blank"
        rel="noopener noreferrer"
      >
        Gymi-Tools
      </a>
    </footer>
  </div>

  <script>
    const bpmElement = document.getElementById("bpm");
    const tapButton = document.getElementById("tapButton");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const tapCountElement = document.getElementById("tapCount");
    const durationElement = document.getElementById("duration");
    const statusElement = document.getElementById("status");

    let running = false;
    let startTime = 0;
    let timestamps = [];
    let timer = null;

    function calculateBpm() {
      if (timestamps.length < 2) {
        return null;
      }

      const firstTap = timestamps[0];
      const lastTap = timestamps[timestamps.length - 1];
      const intervals = timestamps.length - 1;
      const minutes = (lastTap - firstTap) / 60000;

      if (minutes <= 0) {
        return null;
      }

      return Math.round(intervals / minutes);
    }

    function updateDuration() {
      if (!running) {
        return;
      }

      const seconds = (performance.now() - startTime) / 1000;
      durationElement.textContent = `${seconds.toFixed(1)} s`;
    }

    function startMeasurement() {
      running = true;
      startTime = performance.now();
      timestamps = [];

      bpmElement.textContent = "--";
      tapCountElement.textContent = "0";
      durationElement.textContent = "0.0 s";
      statusElement.textContent = "Messung läuft";

      tapButton.disabled = false;
      startButton.disabled = true;
      stopButton.disabled = false;

      clearInterval(timer);
      timer = setInterval(updateDuration, 100);
    }

    function registerHeartbeat() {
      if (!running) {
        return;
      }

      timestamps.push(performance.now());
      tapCountElement.textContent = timestamps.length;

      const bpm = calculateBpm();

      if (bpm !== null) {
        bpmElement.textContent = bpm;
      }

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function stopMeasurement() {
      if (!running) {
        return;
      }

      running = false;
      clearInterval(timer);

      tapButton.disabled = true;
      startButton.disabled = false;
      stopButton.disabled = true;

      const bpm = calculateBpm();

      if (bpm !== null) {
        bpmElement.textContent = bpm;
        statusElement.textContent = "Messung beendet";
      } else {
        bpmElement.textContent = "--";
        statusElement.textContent = "Zu wenige Herzschläge";
      }
    }

    startButton.addEventListener("click", startMeasurement);
    tapButton.addEventListener("click", registerHeartbeat);
    stopButton.addEventListener("click", stopMeasurement);

    document.addEventListener("keydown", event => {
      if (
        running &&
        (event.code === "Space" || event.code === "Enter")
      ) {
        event.preventDefault();
        registerHeartbeat();
      }
    });
  </script>
</body>
</html>
