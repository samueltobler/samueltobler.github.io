<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gruppen-Generator</title>
  <style>
    :root{
      --bg:#f4f6fa;
      --card:rgba(255,255,255,.92);
      --text:#172033;
      --muted:#6b7280;
      --border:#e3e7ef;
      --primary:#172033;
      --primary-hover:#28344d;
      --soft:#f7f8fb;
      --shadow:0 18px 50px rgba(23,32,51,.08);
      --radius:20px;
      --focus:rgba(23,32,51,.13);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 34%),
        linear-gradient(145deg,#f8f9fc 0%,var(--bg) 55%,#edf0f6 100%);
    }

    button,input,textarea{font:inherit}

    .wrap{max-width:1060px;margin:0 auto;padding:44px 20px 26px}

    header{margin-bottom:22px}
    h1{margin:0;font-size:clamp(28px,4vw,38px);letter-spacing:-.035em;line-height:1.05}
    .hint{margin-top:8px;font-size:14px;color:var(--muted)}

    .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:stretch}

    .card{
      background:var(--card);
      border:1px solid rgba(227,231,239,.9);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .panel,.out{padding:22px}
    .out{min-height:470px;display:flex;flex-direction:column}

    label{display:block;font-size:12px;font-weight:650;color:#596174;margin-bottom:8px;letter-spacing:.01em}

    textarea,input[type="number"]{
      width:100%;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      outline:none;
      transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
    }

    textarea{
      min-height:315px;
      resize:vertical;
      border-radius:16px;
      padding:14px 15px;
      font-size:14px;
      line-height:1.55;
    }

    input[type="number"]{border-radius:13px;padding:11px 12px;font-size:14px}

    textarea:focus,input:focus{
      border-color:#b6bfce;
      box-shadow:0 0 0 4px var(--focus);
    }

    .settings-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(210px,1fr);gap:12px;margin-top:14px;align-items:end}

    .toggle-box{
      min-height:65px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--soft);
    }

    .toggle-copy{min-width:0}
    .toggle-title{font-size:13px;font-weight:700;color:var(--text)}
    .toggle-state{margin-top:2px;font-size:11px;color:var(--muted)}

    .switch{position:relative;display:inline-flex;flex:0 0 auto;width:46px;height:26px}
    .switch input{position:absolute;opacity:0;width:1px;height:1px}
    .slider{
      position:absolute;inset:0;border-radius:999px;background:#d7dce5;cursor:pointer;transition:.2s ease;
    }
    .slider::before{
      content:"";
      position:absolute;
      width:20px;height:20px;
      left:3px;top:3px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 2px 6px rgba(23,32,51,.2);
      transition:.2s ease;
    }
    .switch input:checked + .slider{background:var(--primary)}
    .switch input:checked + .slider::before{transform:translateX(20px)}
    .switch input:focus-visible + .slider{box-shadow:0 0 0 4px var(--focus)}
    .switch input:disabled + .slider{opacity:.55;cursor:not-allowed}

    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

    .btn{
      appearance:none;
      border:1px solid transparent;
      border-radius:13px;
      padding:11px 15px;
      font-size:13px;
      font-weight:650;
      cursor:pointer;
      transition:transform .08s ease,background .15s ease,border-color .15s ease,opacity .15s ease;
      white-space:nowrap;
    }
    .btn.primary{background:var(--primary);color:#fff}
    .btn.primary:hover{background:var(--primary-hover)}
    .btn.secondary{background:#fff;color:var(--text);border-color:var(--border)}
    .btn.secondary:hover{background:var(--soft);border-color:#d5dae4}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.72)}

    .out-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .out-title{margin:0;font-size:16px;letter-spacing:-.01em}
    .result-actions{display:flex;gap:8px;flex-wrap:wrap}

    .groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .group{
      border:1px solid var(--border);
      border-radius:16px;
      padding:13px;
      background:#fff;
      transition:transform .15s ease,border-color .15s ease;
    }
    .group:hover{transform:translateY(-1px);border-color:#d5dae4}
    .group h3{margin:0 0 10px;font-size:11px;color:#697184;letter-spacing:.08em;text-transform:uppercase}
    .names{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px}
    .tag{
      display:inline-flex;align-items:center;
      border:1px solid #e5e8ef;
      background:#f9fafc;
      border-radius:999px;
      padding:7px 10px;
      font-size:13px;
      line-height:1;
    }

    .empty{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      border:1px dashed #d7dce5;
      border-radius:16px;
      padding:16px;
      background:rgba(248,249,252,.75);
    }

    .animation-stage{
      min-height:300px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      background:linear-gradient(180deg,#fbfcfe 0%,#f6f8fb 100%);
      overflow:hidden;
    }

    .flying-title{text-align:center;font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:#697184;margin-bottom:14px}
    .flying-layout{
      position:relative;
      min-height:220px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      align-items:start;
    }

    .stack-area,
    .preview-area{
      border:1px solid #dde3ec;
      border-radius:18px;
      padding:14px;
      background:rgba(255,255,255,.9);
    }
    .stack-area{
      display:grid;
      grid-template-columns:auto 1fr;
      align-items:center;
      gap:12px;
      width:100%;
      margin:0;
      min-height:unset;
      text-align:left;
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
    }
    .stack-label,.preview-label{
      width:100%;
      font-size:11px;
      font-weight:750;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#7a8292;
      margin-bottom:10px;
    }
    .stack-label{margin:0;white-space:nowrap}
    .stack-visual{
      position:relative;
      width:96px;
      height:54px;
      margin:0;
      flex:0 0 auto;
    }
    .stack-layer,
    .stack-top-chip,
    .preview-chip,
    .flying-clone{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:36px;
      padding:7px 12px;
      border-radius:999px;
      border:1px solid #e2e6ee;
      background:#fff;
      font-size:13px;
      font-weight:600;
      line-height:1;
      white-space:nowrap;
      box-shadow:0 6px 16px rgba(23,32,51,.06);
    }
    .stack-layer{
      position:absolute;
      left:50%;
      width:76px;
      height:34px;
      border-radius:14px;
      transform:translateX(-50%);
      background:linear-gradient(180deg,#ffffff 0%,#f4f7fb 100%);
    }
    .stack-layer.layer-1{top:18px;opacity:.55;transform:translateX(-50%) rotate(-6deg)}
    .stack-layer.layer-2{top:11px;opacity:.75;transform:translateX(-50%) rotate(4deg)}
    .stack-layer.layer-3{top:5px;opacity:.95;transform:translateX(-50%)}
    .stack-top-chip{
      position:absolute;
      left:50%;
      top:3px;
      transform:translateX(-50%);
      min-width:84px;
      max-width:104px;
      overflow:hidden;
      text-overflow:ellipsis;
      transition:opacity .16s ease,transform .16s ease;
      box-shadow:0 12px 26px rgba(23,32,51,.12);
    }
    .stack-top-chip.is-empty{
      color:#96a0af;
      background:#f6f8fb;
      box-shadow:none;
    }

    .preview-names{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      min-height:40px;
      align-content:flex-start;
    }
    .preview-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .preview-group{
      min-height:104px;
      border:1px solid #dde3ec;
      border-radius:16px;
      padding:12px;
      background:rgba(255,255,255,.95);
      box-shadow:0 8px 22px rgba(23,32,51,.04);
    }
    .preview-group h3{
      margin:0 0 8px;
      font-size:11px;
      color:#697184;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .preview-empty{
      font-size:12px;
      color:#9aa1ad;
      border:1px dashed #e0e5ee;
      border-radius:12px;
      padding:10px;
      background:#fafbfc;
    }

    .progress-wrap{
      margin-top:14px;
      height:8px;
      border-radius:999px;
      background:#e9edf4;
      overflow:hidden;
    }
    .progress{
      width:0%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#172033 0%,#425170 100%);
      transition:width .2s ease;
    }

    .flying-clone{
      position:absolute;
      left:0;
      top:0;
      z-index:20;
      pointer-events:none;
      transition:transform .62s cubic-bezier(.22,.8,.23,1),opacity .62s ease;
      box-shadow:0 14px 28px rgba(23,32,51,.14);
    }

    @media(max-width:700px){
      .flying-layout{min-height:unset}
      .stack-area{grid-template-columns:auto 1fr;gap:10px 12px}
      .stack-label{grid-column:1 / -1}
    }
    @media(max-width:560px){
      .preview-grid{grid-template-columns:1fr}
    }


    .toast{
      position:fixed;
      left:50%;bottom:18px;
      transform:translateX(-50%);
      background:rgba(23,32,51,.96);
      color:#fff;
      padding:10px 13px;
      border-radius:999px;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease,transform .18s ease;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}

    .footer{margin-top:28px;text-align:center;font-size:11px;color:#8a91a0}
    .footer a{color:inherit;text-decoration:none}
    .footer a:hover{text-decoration:underline}

    @media(max-width:860px){
      .grid{grid-template-columns:1fr}
      .out{min-height:380px}
    }
    @media(max-width:560px){
      .wrap{padding:28px 14px 20px}
      .panel,.out{padding:17px}
      .settings-row{grid-template-columns:1fr}
      .groups{grid-template-columns:1fr}
      .btn{flex:1 1 auto}
    }
    @media(prefers-reduced-motion:reduce){
      .flying-clone,.anim-chip{transition:none!important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Gruppen-Generator</h1>
      <div class="hint">Ein Tool, um automatisch zufällige Gruppen zu generieren.</div>
    </header>

    <div class="grid">
      <section class="card panel" aria-label="Eingaben">
        <label for="names">Namen (eine Person pro Zeile oder mit Komma getrennt)</label>
        <textarea id="names" placeholder="z.B.&#10;Aylin&#10;Ben&#10;Chiara&#10;Diego"></textarea>

        <div class="settings-row">
          <div>
            <label for="groupCount">Anzahl Gruppen</label>
            <input id="groupCount" type="number" min="1" step="1" inputmode="numeric" value="3" />
          </div>

          <div class="toggle-box">
            <div class="toggle-copy">
              <div class="toggle-title">Fliegende Namen</div>
              <div class="toggle-state" id="animationState">Animation ein</div>
            </div>
            <label class="switch" aria-label="Fliegende Namen ein- oder ausschalten">
              <input id="animationToggle" type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="makeBtn">Gruppen bilden</button>
          <button class="btn secondary" id="shuffleBtn" title="Nur neu mischen; gleiche Anzahl Gruppen">Neu mischen</button>
          <button class="btn secondary" id="clearBtn">Leeren</button>
        </div>

        <div class="meta" aria-live="polite">
          <span class="pill" id="countPill">0 Namen</span>
          <span class="pill" id="statusPill">Bereit</span>
        </div>
      </section>

      <section class="card out" aria-label="Ausgabe">
        <div class="out-head">
          <h2 class="out-title">Ergebnis</h2>
          <div class="result-actions">
            <button class="btn secondary" id="copyBtn" disabled>Als Text kopieren</button>
            <button class="btn secondary" id="pngBtn" disabled>Als PNG herunterladen</button>
          </div>
        </div>

        <div id="output">
          <div class="empty">Gib links Namen ein und bilde Gruppen; hier erscheinen die zufällig verteilten Gruppen.</div>
        </div>
      </section>
    </div>

    <div class="footer">
      by <a href="https://samueltobler.github.io" target="_blank" rel="noopener">Samuel Tobler</a> |
      <a href="https://samueltobler.github.io/gymi-tools" target="_blank" rel="noopener">Gymi-Tools</a>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const namesEl = $("names");
    const groupCountEl = $("groupCount");
    const animationToggleEl = $("animationToggle");
    const animationStateEl = $("animationState");
    const makeBtn = $("makeBtn");
    const shuffleBtn = $("shuffleBtn");
    const clearBtn = $("clearBtn");
    const copyBtn = $("copyBtn");
    const pngBtn = $("pngBtn");
    const outputEl = $("output");
    const countPill = $("countPill");
    const statusPill = $("statusPill");
    const toastEl = $("toast");

    let lastGroups = null;
    let activeTimers = [];

    function normaliseNames(raw){
      return raw
        .split(/\r?\n/)
        .flatMap(line => line.split(","))
        .map(s => s.trim())
        .filter(Boolean);
    }

    function getGroupCount(){
      const v = Number(groupCountEl.value);
      const k = Number.isFinite(v) ? Math.floor(v) : 1;
      return Math.max(1,k);
    }

    function cryptoRandomInt(max){
      if(max <= 1) return 0;
      const limit = Math.floor(0x100000000 / max) * max;
      const buf = new Uint32Array(1);
      do{ crypto.getRandomValues(buf); }while(buf[0] >= limit);
      return buf[0] % max;
    }

    function cryptoShuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = cryptoRandomInt(i + 1);
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }

    function distribute(names,k){
      const groups = Array.from({length:k},() => []);
      names.forEach((name,idx) => groups[idx % k].push(name));
      return groups;
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g,m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    }

    function render(groups){
      if(!groups || !groups.length){
        outputEl.innerHTML = '<div class="empty">Keine Gruppen vorhanden.</div>';
        copyBtn.disabled = true;
        pngBtn.disabled = true;
        return;
      }

      outputEl.innerHTML = `
        <div class="groups">
          ${groups.map((group,i) => `
            <div class="group">
              <h3>Gruppe ${i + 1}</h3>
              ${group.length
                ? `<ul class="names">${group.map(name => `<li class="tag">${escapeHtml(name)}</li>`).join("")}</ul>`
                : '<div class="empty" style="margin:0;padding:10px;font-size:12px">Leer</div>'
              }
            </div>
          `).join("")}
        </div>`;

      copyBtn.disabled = false;
      pngBtn.disabled = false;
    }

    function setStatus(text){
      statusPill.textContent = text;
    }

    function updateCount(){
      const names = normaliseNames(namesEl.value);
      countPill.textContent = `${names.length} Name${names.length === 1 ? "" : "n"}`;
      return names.length;
    }

    function updateAnimationState(){
      animationStateEl.textContent = animationToggleEl.checked ? "Animation ein" : "Keine Animation";
    }

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      window.clearTimeout(toastEl._t);
      toastEl._t = window.setTimeout(() => toastEl.classList.remove("show"),1400);
    }

    function setBusy(busy){
      makeBtn.disabled = busy;
      shuffleBtn.disabled = busy;
      clearBtn.disabled = busy;
      pngBtn.disabled = busy || !lastGroups;
      groupCountEl.disabled = busy;
      animationToggleEl.disabled = busy;
      namesEl.disabled = busy;
    }

    function later(fn,ms){
      const id = window.setTimeout(fn,ms);
      activeTimers.push(id);
      return id;
    }

    function clearTimers(){
      activeTimers.forEach(id => window.clearTimeout(id));
      activeTimers = [];
    }

    function finishAnimation(groups,statusText){
      clearTimers();
      setBusy(false);
      lastGroups = groups;
      setStatus(statusText);
      render(groups);
    }

    function assignmentSequence(shuffled,k){
      return shuffled.map((name,index) => ({name,groupIndex:index % k}));
    }

    function animateFlyingNames(shuffled,groups,k,statusText){
      setBusy(true);
      copyBtn.disabled = true;
      pngBtn.disabled = true;
      setStatus("Fliegende Namen laufen …");

      const sequence = assignmentSequence(shuffled,k).map((item,index) => ({...item,id:index}));

      outputEl.innerHTML = `
        <div class="animation-stage" id="animationStage" role="status" aria-live="polite">
          <div class="flying-title">Fliegende Namen</div>
          <div class="flying-layout">
            <div class="stack-area">
              <div class="stack-label">Namensstapel</div>
              <div class="stack-visual">
                <span class="stack-layer layer-1"></span>
                <span class="stack-layer layer-2"></span>
                <span class="stack-layer layer-3"></span>
                <span class="stack-top-chip" id="stackTopChip"></span>
              </div>
            </div>
            <div class="preview-area">
              <div class="preview-label">Zielgruppen</div>
              <div class="preview-grid">
                ${Array.from({length:k},(_,i) => `
                  <div class="preview-group">
                    <h3>Gruppe ${i + 1}</h3>
                    <div class="preview-names" id="previewNames${i}"><div class="preview-empty">Noch leer</div></div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
          <div class="progress-wrap"><div class="progress" id="animationProgress"></div></div>
        </div>`;

      const stageEl = $("animationStage");
      const progressEl = $("animationProgress");
      const stackTopChipEl = $("stackTopChip");
      const prefersReduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      const stepDuration = prefersReduced ? 120 : 260;
      const flyDuration = prefersReduced ? 0 : 620;

      function shortenLabel(value,max=12){
        return value.length > max ? value.slice(0,max - 1) + '…' : value;
      }

      function updateStack(index){
        const nextItem = sequence[index];
        if(stackTopChipEl){
          if(nextItem){
            stackTopChipEl.textContent = shortenLabel(nextItem.name);
            stackTopChipEl.title = nextItem.name;
            stackTopChipEl.classList.remove('is-empty');
            stackTopChipEl.style.opacity = '1';
            stackTopChipEl.style.transform = 'translateX(-50%)';
          }else{
            stackTopChipEl.textContent = 'Fertig';
            stackTopChipEl.title = 'Fertig';
            stackTopChipEl.classList.add('is-empty');
          }
        }
      }

      function addToPreview(item){
        const list = $("previewNames" + item.groupIndex);
        if(!list) return;
        const empty = list.querySelector('.preview-empty');
        if(empty) empty.remove();
        const chip = document.createElement('span');
        chip.className = 'preview-chip';
        chip.textContent = item.name;
        list.appendChild(chip);
      }

      function flyOne(item,index){
        const source = stackTopChipEl;
        const targetList = $("previewNames" + item.groupIndex);
        if(!source || !targetList || !stageEl){
          addToPreview(item);
          updateStack(index + 1);
          if(progressEl) progressEl.style.width = `${((index + 1) / sequence.length) * 100}%`;
          return;
        }

        const empty = targetList.querySelector('.preview-empty');
        const stageRect = stageEl.getBoundingClientRect();
        const sourceRect = source.getBoundingClientRect();
        const targetRect = targetList.getBoundingClientRect();

        const clone = document.createElement('span');
        clone.className = 'flying-clone';
        clone.textContent = item.name;
        clone.style.left = `${sourceRect.left - stageRect.left}px`;
        clone.style.top = `${sourceRect.top - stageRect.top}px`;
        clone.style.width = `${Math.ceil(sourceRect.width)}px`;
        clone.style.height = `${Math.ceil(sourceRect.height)}px`;
        stageEl.appendChild(clone);

        source.style.opacity = '.18';
        source.style.transform = 'translateX(-50%) scale(.92)';

        const targetX = targetRect.left - stageRect.left + 10;
        const targetY = targetRect.top - stageRect.top + (empty ? 10 : targetList.scrollHeight - 4);
        const dx = targetX - (sourceRect.left - stageRect.left);
        const dy = targetY - (sourceRect.top - stageRect.top);

        requestAnimationFrame(() => {
          clone.style.transform = `translate(${dx}px, ${dy}px) scale(.96)`;
          clone.style.opacity = '.15';
        });

        later(() => {
          clone.remove();
          addToPreview(item);
          updateStack(index + 1);
          if(progressEl) progressEl.style.width = `${((index + 1) / sequence.length) * 100}%`;
        },flyDuration);
      }

      updateStack(0);

      sequence.forEach((item,index) => {
        later(() => flyOne(item,index), index * stepDuration);
      });

      later(() => finishAnimation(groups,statusText), sequence.length * stepDuration + flyDuration + 220);
    }

    function runGrouping(statusKind){
      clearTimers();
      const names = normaliseNames(namesEl.value);
      const k = getGroupCount();
      updateCount();

      if(names.length === 0){
        lastGroups = null;
        render(null);
        setStatus("Bitte Namen eingeben");
        return;
      }

      const shuffled = cryptoShuffle(names);
      const groups = distribute(shuffled,k);
      const statusText = statusKind === "reshuffle"
        ? "Neu gemischt"
        : k === 1
          ? "1 Gruppe erstellt"
          : k > names.length
            ? `Mehr Gruppen als Namen; es werden ${k} Gruppen erstellt`
            : `${k} Gruppen erstellt`;

      if(animationToggleEl.checked){
        animateFlyingNames(shuffled,groups,k,statusText);
      }else{
        lastGroups = groups;
        setStatus(statusText);
        render(groups);
      }
    }

    function copyAsText(){
      if(!lastGroups) return;
      const lines = lastGroups
        .map((group,i) => `Gruppe ${i + 1}: ${group.length ? group.join(", ") : "—"}`)
        .join("\n");

      navigator.clipboard.writeText(lines).then(() => {
        toast("Kopiert");
      }).catch(() => {
        const tmp = document.createElement("textarea");
        tmp.value = lines;
        document.body.appendChild(tmp);
        tmp.select();
        try{
          document.execCommand("copy");
          toast("Kopiert");
        }catch(e){
          toast("Kopieren nicht möglich");
        }
        document.body.removeChild(tmp);
      });
    }


    function roundedRect(ctx,x,y,w,h,r){
      const radius = Math.min(r,w / 2,h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius,y);
      ctx.arcTo(x + w,y,x + w,y + h,radius);
      ctx.arcTo(x + w,y + h,x,y + h,radius);
      ctx.arcTo(x,y + h,x,y,radius);
      ctx.arcTo(x,y,x + w,y,radius);
      ctx.closePath();
    }

    function makeExportLayout(ctx,groups,contentWidth){
      const columns = groups.length === 1 ? 1 : 2;
      const gap = 28;
      const cardWidth = (contentWidth - gap * (columns - 1)) / columns;
      const cardPadding = 28;
      const tagGap = 10;
      const tagHeight = 38;
      const titleHeight = 42;
      const rowGap = 24;
      const layouts = [];
      const rowHeights = [];

      ctx.font = '600 22px Inter, Arial, sans-serif';

      groups.forEach((group,index) => {
        let x = cardPadding;
        let y = titleHeight;
        const tags = [];
        const maxX = cardWidth - cardPadding;

        if(group.length === 0){
          tags.push({text:'—',x,y,w:42});
          y += tagHeight;
        }else{
          group.forEach(name => {
            const measured = Math.ceil(ctx.measureText(name).width);
            const tagWidth = Math.min(cardWidth - cardPadding * 2,Math.max(54,measured + 28));
            if(x + tagWidth > maxX && x > cardPadding){
              x = cardPadding;
              y += tagHeight + tagGap;
            }
            tags.push({text:name,x,y,w:tagWidth});
            x += tagWidth + tagGap;
          });
          y += tagHeight;
        }

        const height = y + cardPadding;
        const row = Math.floor(index / columns);
        rowHeights[row] = Math.max(rowHeights[row] || 0,height);
        layouts.push({index,row,col:index % columns,cardWidth,height,tags});
      });

      const rowOffsets = [];
      let cursorY = 0;
      rowHeights.forEach((height,row) => {
        rowOffsets[row] = cursorY;
        cursorY += height + (row < rowHeights.length - 1 ? rowGap : 0);
      });

      layouts.forEach(layout => {
        layout.x = layout.col * (cardWidth + gap);
        layout.y = rowOffsets[layout.row];
        layout.height = rowHeights[layout.row];
      });

      return {layouts,totalHeight:cursorY,cardWidth};
    }

    async function downloadAsPng(){
      if(!lastGroups) return;

      try{
        if(document.fonts?.ready) await document.fonts.ready;

        const logicalWidth = 1200;
        const outerPadding = 64;
        const headerHeight = 126;
        const footerHeight = 62;
        const contentWidth = logicalWidth - outerPadding * 2;
        const measureCanvas = document.createElement('canvas');
        const measureCtx = measureCanvas.getContext('2d');
        const layout = makeExportLayout(measureCtx,lastGroups,contentWidth);
        const logicalHeight = outerPadding + headerHeight + layout.totalHeight + footerHeight + outerPadding;
        const scale = logicalHeight > 3000 ? 2 : 3;

        const canvas = document.createElement('canvas');
        canvas.width = logicalWidth * scale;
        canvas.height = Math.ceil(logicalHeight * scale);
        const ctx = canvas.getContext('2d');
        ctx.scale(scale,scale);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,logicalWidth,logicalHeight);

        ctx.fillStyle = '#172033';
        ctx.font = '700 46px Inter, Arial, sans-serif';
        ctx.fillText('Gruppen',outerPadding,outerPadding + 48);

        const totalNames = lastGroups.reduce((sum,group) => sum + group.length,0);
        ctx.fillStyle = '#6b7280';
        ctx.font = '400 21px Inter, Arial, sans-serif';
        ctx.fillText(`${lastGroups.length} Gruppe${lastGroups.length === 1 ? '' : 'n'} · ${totalNames} Name${totalNames === 1 ? '' : 'n'}`,outerPadding,outerPadding + 84);

        const startY = outerPadding + headerHeight;

        layout.layouts.forEach(item => {
          const x = outerPadding + item.x;
          const y = startY + item.y;
          const w = item.cardWidth;
          const h = item.height;

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#dfe3ea';
          ctx.lineWidth = 2;
          roundedRect(ctx,x,y,w,h,22);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#697184';
          ctx.font = '700 17px Inter, Arial, sans-serif';
          ctx.fillText(`GRUPPE ${item.index + 1}`,x + 28,y + 32);

          ctx.font = '600 22px Inter, Arial, sans-serif';
          item.tags.forEach(tag => {
            const tx = x + tag.x;
            const ty = y + tag.y;
            ctx.fillStyle = '#f7f8fb';
            ctx.strokeStyle = '#e3e7ef';
            ctx.lineWidth = 1.5;
            roundedRect(ctx,tx,ty,tag.w,38,19);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#172033';
            ctx.textBaseline = 'middle';
            let text = tag.text;
            const maxTextWidth = tag.w - 24;
            if(ctx.measureText(text).width > maxTextWidth){
              while(text.length > 1 && ctx.measureText(text + '…').width > maxTextWidth){
                text = text.slice(0,-1);
              }
              text += '…';
            }
            ctx.fillText(text,tx + 12,ty + 19);
            ctx.textBaseline = 'alphabetic';
          });
        });

        ctx.fillStyle = '#9aa0ac';
        ctx.font = '400 16px Inter, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Samuel Tobler | Gymi-Tools',logicalWidth / 2,logicalHeight - outerPadding + 8);
        ctx.textAlign = 'start';

        canvas.toBlob(blob => {
          if(!blob){
            toast('PNG konnte nicht erstellt werden');
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const stamp = new Date().toISOString().slice(0,10);
          link.href = url;
          link.download = `gruppen-${stamp}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url),1000);
          toast(`PNG gespeichert (${canvas.width} px breit)`);
        },'image/png');
      }catch(e){
        toast('PNG konnte nicht erstellt werden');
      }
    }

    function clearAll(){
      clearTimers();
      setBusy(false);
      namesEl.value = "";
      groupCountEl.value = "3";
      lastGroups = null;
      updateCount();
      setStatus("Bereit");
      render(null);
      namesEl.focus();
    }

    groupCountEl.addEventListener("input",() => {
      const k = getGroupCount();
      groupCountEl.value = String(k);
      setStatus("Bereit");
    });

    animationToggleEl.addEventListener("change",() => {
      updateAnimationState();
    });

    makeBtn.addEventListener("click",() => runGrouping("build"));
    shuffleBtn.addEventListener("click",() => runGrouping("reshuffle"));
    clearBtn.addEventListener("click",clearAll);
    copyBtn.addEventListener("click",copyAsText);
    pngBtn.addEventListener("click",downloadAsPng);

    namesEl.addEventListener("input",() => {
      updateCount();
      setStatus("Bereit");
    });

    namesEl.addEventListener("keydown",e => {
      if((e.ctrlKey || e.metaKey) && e.key === "Enter") runGrouping("build");
    });

    updateCount();
    updateAnimationState();
  </script>
</body>
</html>
