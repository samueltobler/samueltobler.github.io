<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>Freeze Dance</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#1b1d25;--ink:#f7f7f2;--accent:#d6fc72;--line:#343640}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100dvh}button,a,input{font:inherit}button,.icon{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none}button:hover,.icon:hover{filter:brightness(1.16)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:disabled{opacity:.45;cursor:default}header{padding:20px 24px;display:flex;align-items:center;justify-content:flex-start;gap:18px}.icon{width:50px;height:50px;padding:12px;display:inline-flex;align-items:center;justify-content:center}.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}h1{font-size:20px;letter-spacing:-.7px;margin:0}main{max-width:1120px;margin:0 auto;padding:20px 24px}.video{aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:20px;overflow:hidden}.video iframe{display:block;width:100%;height:100%;border:0}.state{min-height:62px;display:flex;justify-content:center;align-items:center;font-size:30px;font-weight:900;letter-spacing:1px;color:var(--accent)}.controls{display:flex;justify-content:center;gap:12px;margin:22px 0;flex-wrap:wrap}.primary{background:var(--accent);border-color:var(--accent);color:#141a0c;min-width:145px}.freeze{--accent:#a7c7ff}.backdrop{position:fixed;inset:0;background:#0009;z-index:5}.backdrop[hidden]{display:none}.menu{max-height:calc(100dvh - 100px);overflow:auto;position:absolute;top:80px;left:24px;width:min(330px,calc(100% - 48px));padding:26px;background:#20222b;border:1px solid #474953;border-radius:20px;box-shadow:0 20px 80px #0008}.slider-row{display:grid;grid-template-columns:24px 1fr 42px;align-items:center;gap:15px}.slider-row+.slider-row{margin-top:26px}.setting-label{display:block;font-size:13px;font-weight:400;line-height:1.5;color:#c7cad5;margin:0 0 10px}.setting-group+.setting-group{margin-top:24px}.slider-row svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.video-input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font-size:13px}.video-actions{display:flex;gap:8px;margin-top:10px}.video-actions button{padding:10px 12px;font-size:12px;flex:1}.link-error{font-size:12px;color:#ffb4b4;margin:10px 0 0}.link-error:empty{display:none}output{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}@media(max-width:600px){header{padding:16px}main{padding:8px 12px}.controls{gap:8px}.controls button{padding:13px 16px}.menu{left:16px;width:min(330px,calc(100% - 32px))}.video{border-radius:12px}}
</style>
</head>
<body>
<header><button class="icon" id="settings" aria-label="Einstellungen" aria-haspopup="dialog" aria-controls="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.2-2 .9-2-.7-2.3 4 1.6 1.5v2.2l-1.6 1.5 2.3 4 2-.7 2 .9.6 2.2h5l.6-2.2 2-.9 2 .7 2.3-4-1.6-1.5v-2.2l1.6-1.5-2.3-4-2 .7-2-.9L14.5 3z"/><circle cx="12" cy="12" r="3"/></svg></button><h1>Freeze Dance</h1></header>
<main><div id="state" class="state" role="status" aria-live="polite"></div><div class="video"><iframe id="player" title="Freeze Dance Video" src="https://www.youtube.com/embed/ZZ5LpwO-An4?enablejsapi=1&amp;playsinline=1&amp;rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="controls"><button id="start" class="primary" disabled>Start</button><button id="reset">Zurücksetzen</button><button id="fullscreen">Vollbild</button></div></main>
<div id="backdrop" class="backdrop" hidden><section id="menu" class="menu" role="dialog" aria-modal="true" aria-label="Einstellungen"><div class="setting-group"><label class="setting-label" for="average">Durchschnittliche Tanzzeit zwischen zwei Stopps.</label><div class="slider-row"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg><input id="average" type="range" min="5" max="90" step="1" value="20" aria-label="Durchschnittliche Tanzzeit in Sekunden" title="Durchschnittliche Tanzzeit" aria-describedby="averageOut"><output id="averageOut" for="average">20 s</output></div></div><div class="setting-group"><label class="setting-label" for="duration">So lange müssen alle stillstehen.</label><div class="slider-row"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><input id="duration" type="range" min="2" max="15" step="1" value="5" aria-label="Stoppdauer in Sekunden" title="Stoppdauer" aria-describedby="durationOut"><output id="durationOut" for="duration">5 s</output></div></div><div class="setting-group"><label class="setting-label" for="videoLink">YouTube-Link für das Video.</label><form id="videoForm"><input id="videoLink" class="video-input" type="text" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false" aria-describedby="linkError"><div class="video-actions"><button type="submit">Video übernehmen</button><button type="button" id="defaultVideo">Standardvideo</button></div><p id="linkError" class="link-error" role="status"></p></form></div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DEFAULT_VIDEO='ZZ5LpwO-An4';
let config={average:20,duration:5,videoId:DEFAULT_VIDEO};
try{const s=JSON.parse(localStorage.getItem('freeze-dance-settings'));if(s){config.average=Math.min(90,Math.max(5,Number(s.average)||20));config.duration=Math.min(15,Math.max(2,Number(s.duration)||5));if(/^[A-Za-z0-9_-]{11}$/.test(s.videoId||''))config.videoId=s.videoId;}}catch(e){}
let player,ready=false,mode='idle',resumeMode='dance',playing=false,elapsed=0,target=0,lastTick=0,ticker=null;
function parseVideoLink(text){
try{let value=text.trim();if(!/^https?:\/\//i.test(value))value='https://'+value;const url=new URL(value);if(!['http:','https:'].includes(url.protocol)||url.username||url.password)return null;const host=url.hostname.toLowerCase();let id=null;if(host==='youtu.be')id=url.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){if(url.pathname==='/watch')id=url.searchParams.get('v');else if(/^\/(embed|shorts|live)\//.test(url.pathname))id=url.pathname.split('/')[2];}return /^[A-Za-z0-9_-]{11}$/.test(id||'')?id:null;}catch(e){return null;}}
function persist(){try{localStorage.setItem('freeze-dance-settings',JSON.stringify(config));}catch(e){}}
function applyVideo(id){reset();config.videoId=id;persist();$('videoLink').value='https://www.youtube.com/watch?v='+id;$('videoLink').setAttribute('aria-invalid','false');$('linkError').textContent='';if(player&&ready){player.cueVideoById(id);$('start').disabled=false;}else{const url=new URL($('player').src);url.pathname='/embed/'+id;$('player').src=url.href;}closeMenu();}
function randomInterval(mean,random=Math.random){return mean*(.6+.8*random());}
function render(){document.body.classList.toggle('freeze',mode==='freeze');$('state').textContent=({idle:'',dance:'TANZEN',freeze:'FREEZE',paused:'PAUSE',ended:''})[mode];$('start').textContent=mode==='paused'?'Weiter':mode==='dance'||mode==='freeze'?'Pause':'Start';}
function settingsView(){$('average').value=config.average;$('duration').value=config.duration;$('averageOut').textContent=config.average+' s';$('durationOut').textContent=config.duration+' s';}
function saveSettings(){config.average=Number($('average').value);config.duration=Number($('duration').value);settingsView();try{localStorage.setItem('freeze-dance-settings',JSON.stringify(config));}catch(e){}}
function pauseMedia(){if(player&&ready)player.pauseVideo();}
function playMedia(){if(player&&ready)player.playVideo();}
function startTicker(){clearInterval(ticker);lastTick=performance.now();ticker=setInterval(tick,80);}
function tick(){const now=performance.now(),delta=now-lastTick;lastTick=now;if(mode==='freeze'||mode==='dance'&&playing)elapsed+=delta;if(mode==='dance'&&elapsed>=target){mode='freeze';elapsed=0;target=config.duration*1000;playing=false;pauseMedia();render();}else if(mode==='freeze'&&elapsed>=target){mode='dance';elapsed=0;target=randomInterval(config.average)*1000;playMedia();render();}}
function pauseGame(){if(mode!=='dance'&&mode!=='freeze')return;resumeMode=mode;mode='paused';clearInterval(ticker);playing=false;pauseMedia();render();}
function toggle(){if(!ready)return;if(mode==='dance'||mode==='freeze'){pauseGame();return;}if(mode==='paused')mode=resumeMode;else{if(mode==='ended')player.seekTo(0,true);mode='dance';elapsed=0;target=randomInterval(config.average)*1000;}if(mode==='dance')playMedia();startTicker();render();}
function reset(){mode='idle';clearInterval(ticker);playing=false;pauseMedia();if(ready)player.seekTo(0,true);elapsed=0;render();}
function mediaState(value){if(value==='ended'){mode='ended';playing=false;clearInterval(ticker);render();}else if(value==='playing'){playing=true;if(mode==='idle'||mode==='ended'){mode='dance';elapsed=0;target=randomInterval(config.average)*1000;startTicker();render();}else if(mode==='paused'){mode=resumeMode;if(mode==='freeze'){pauseMedia();playing=false;}startTicker();render();}else if(mode==='freeze'){pauseMedia();playing=false;}}else{playing=false;if(value==='paused'&&mode==='dance')pauseGame();}}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{events:{onReady:()=>{ready=true;$('start').disabled=false;render();},onStateChange:e=>mediaState(e.data===1?'playing':e.data===0?'ended':e.data===2?'paused':'waiting'),onError:()=>{pauseGame();$('start').disabled=true;$('start').textContent='Video nicht verfügbar';},onAutoplayBlocked:pauseGame}});};
$('start').onclick=toggle;$('reset').onclick=reset;$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){}};
function closeMenu(){$('backdrop').hidden=true;$('settings').setAttribute('aria-expanded','false');$('settings').focus();}
$('settings').onclick=()=>{const open=$('backdrop').hidden;$('backdrop').hidden=!open;$('settings').setAttribute('aria-expanded',String(open));if(open){$('videoLink').value='https://www.youtube.com/watch?v='+config.videoId;$('linkError').textContent='';$('videoLink').setAttribute('aria-invalid','false');$('average').focus();}};$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeMenu();};$('average').oninput=saveSettings;$('duration').oninput=saveSettings;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('backdrop').hidden)closeMenu();if(!$('backdrop').hidden&&e.key==='Tab'){if(e.shiftKey&&document.activeElement===$('average')){e.preventDefault();$('defaultVideo').focus();}else if(!e.shiftKey&&document.activeElement===$('defaultVideo')){e.preventDefault();$('average').focus();}}if(e.code==='Space'&&$('backdrop').hidden&&!/INPUT|BUTTON|A/.test(e.target.tagName)){e.preventDefault();toggle();}});
$('videoForm').onsubmit=e=>{e.preventDefault();const id=parseVideoLink($('videoLink').value);if(!id){$('linkError').textContent='Bitte einen gültigen YouTube-Videolink eingeben.';$('videoLink').setAttribute('aria-invalid','true');$('videoLink').focus();return;}applyVideo(id);};$('defaultVideo').onclick=()=>applyVideo(DEFAULT_VIDEO);
$('videoLink').value='https://www.youtube.com/watch?v='+config.videoId;
{const frame=$('player'),url=new URL(frame.src);url.pathname='/embed/'+config.videoId;frame.src=url.href;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});settingsView();render();
if(location.protocol==='http:'||location.protocol==='https:'){const frame=$('player'),url=new URL(frame.src);url.searchParams.set('origin',location.origin);frame.src=url.href;}
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.appendChild(api);
</script>
</body></html>
