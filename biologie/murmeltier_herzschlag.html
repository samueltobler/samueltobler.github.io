<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murmeltier-Herzschlag</title>
  <style>
    :root {
      --text: #2f3142;
      --muted: rgba(47,49,66,0.7);
      --summer-1: #ffd7cc;
      --summer-2: #fff0c9;
      --winter-1: #dfe6ff;
      --winter-2: #d9f5ff;
      --glass: rgba(255,255,255,0.22);
      --heart-1: #ff7d98;
      --heart-2: #ff5478;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #fff8f6 0%, #f4f8ff 100%);
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      padding: 28px 18px 8px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.7vw, 2.4rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 10px auto 0;
      max-width: 700px;
      color: var(--muted);
      font-size: 1rem;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      padding: 22px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 60px rgba(73, 84, 116, 0.14);
      border: 1px solid rgba(255,255,255,0.55);
    }

    .summer {
      background: linear-gradient(160deg, var(--summer-1), var(--summer-2));
    }

    .winter {
      background: linear-gradient(160deg, var(--winter-1), var(--winter-2));
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(88%, 480px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 12px 25px;
      border-radius: 999px;
      background: rgba(255,255,255,0.34);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .heart-area {
      height: 220px;
      display: grid;
      place-items: center;
      margin-top: 4px;
    }

    .heart {
      width: 145px;
      height: 145px;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 16px 18px rgba(255,84,120,0.23));
      transform: scale(1);
      transform-origin: center;
    }

    .heart.beat { animation: heartbeat 0.35s ease-out; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.19); }
    }

    .number {
      font-size: clamp(3rem, 7vw, 5rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.05em;
      margin: 0;
    }

    .label {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .info {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.24);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 0.96rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5478;
      opacity: 0.28;
      transform: scale(1);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .pulse-dot.active {
      opacity: 1;
      transform: scale(1.7);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 420px;
      }

      .heart-area {
        height: 180px;
      }

      .heart { width: 120px; height: 120px; }
    }
    .footer{
      margin-top:32px;
      text-align:center;
      font-size:11px;
      color:rgba(0,0,0,0.3);
    }

    .footer a{
      color:rgba(0,0,0,0.3);
      text-decoration:none;
    }

    .footer a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Herzschlag beim Murmeltier</h1>
    
  </header>

  <main class="grid">
    <section class="panel summer">
      <div class="content">
        <div class="tag">Sommer</div>
        <div class="heart-area">
          <svg class="heart" id="heart-summer" viewBox="0 0 100 100" aria-label="Pulsierendes Herz" role="img"><defs><linearGradient id="gradient-summer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff829f"/><stop offset="1" stop-color="#ff5276"/></linearGradient></defs><path d="M50 88 C40 79 7 54 7 32 C7 18 18 9 31 9 C40 9 47 14 50 21 C53 14 60 9 69 9 C82 9 93 18 93 32 C93 54 60 79 50 88 Z" fill="url(#gradient-summer)"/></svg>
        </div>
        <p class="number">120</p>
        <p class="label">Schläge pro Minute</p>
        
      </div>
    </section>

    <section class="panel winter">
      <div class="content">
        <div class="tag">Winter</div>
        <div class="heart-area">
          <svg class="heart" id="heart-winter" viewBox="0 0 100 100" aria-label="Pulsierendes Herz" role="img"><defs><linearGradient id="gradient-winter" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff829f"/><stop offset="1" stop-color="#ff5276"/></linearGradient></defs><path d="M50 88 C40 79 7 54 7 32 C7 18 18 9 31 9 C40 9 47 14 50 21 C53 14 60 9 69 9 C82 9 93 18 93 32 C93 54 60 79 50 88 Z" fill="url(#gradient-winter)"/></svg>
        </div>
        <p class="number">5</p>
        <p class="label">Schläge pro Minute</p>
        
      </div>
    </section>
  </main>
  <div class="footer">
      by <a href="https://samueltobler.github.io/gymi-tools" target="_blank">Gymi-Tools</a><br><br>
    </div>

  <script>
    function startHeartbeat(heartId, intervalMs) {
      const heart = document.getElementById(heartId);
      function beat() {
        heart.classList.remove('beat');
        void heart.getBoundingClientRect();
        heart.classList.add('beat');
      }
      beat();
      setInterval(beat, intervalMs);
    }
    startHeartbeat('heart-summer', 500);
    startHeartbeat('heart-winter', 12000);
  </script>
</body>
</html>
